name: Lint and Format
on:
  pull_request:
  push:
    branches-ignore:
      - master
      - release/*
    tags-ignore:
      - v*
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so --new-from-merge-base can resolve the base
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Clean Go Build Cache
        run: go clean -cache -modcache -testcache
      - 
        name: Run linting
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # On PRs, filter to new issues via git merge-base — the action's patch-based
          # only-new-issues filter fails on PRs whose diff exceeds GitHub's 20k-line API limit
          # (e.g. vendor updates). The action forbids combining the two, so only-new-issues
          # stays on for push events only.
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: --timeout=5m ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }}
          version: v2.13.2
  format:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      -
        name: Run formatting
        run: gofmt -s -w duplocloud duplosdk
      - 
        name: Check if formatting changed
        id: git-check
        run: |
          if git diff-index --quiet HEAD --; then 
            echo "modified=false" >> $GITHUB_ENV; 
          else 
            echo "modified=true" >> $GITHUB_ENV;
          fi
      - 
        name: Commit formatting changes
        if: env.modified == 'true'
        run: |
          git config --global user.name 'Duplo Githug Bot'
          git config --global user.email 'tahir+github-bot@duplocloud.net'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git commit -am "lint: go fmt"
          git push
